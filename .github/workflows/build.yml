name: Build release APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Install actionlint 1.7.12
        shell: bash
        run: |
          set -euo pipefail
          version=1.7.12
          archive="actionlint_${version}_linux_amd64.tar.gz"
          checksums="actionlint_${version}_checksums.txt"
          base_url="https://github.com/rhysd/actionlint/releases/download/v${version}"
          archive_path="$RUNNER_TEMP/$archive"
          checksums_path="$RUNNER_TEMP/$checksums"
          install_dir="$RUNNER_TEMP/actionlint"

          curl --fail --location --silent --show-error --output "$archive_path" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$checksums_path" "$base_url/$checksums"
          expected=$(awk -v archive="$archive" '$2 == archive || $2 == "*" archive { print $1; exit }' "$checksums_path")
          [ -n "$expected" ]
          actual=$(sha256sum "$archive_path" | awk '{ print $1 }')
          [ "$actual" = "$expected" ]
          mkdir -p "$install_dir"
          tar -xzf "$archive_path" -C "$install_dir"
          printf '%s\n' "$install_dir" >> "$GITHUB_PATH"

      - name: Lint workflow
        run: actionlint .github/workflows/build.yml

      - name: Check required secrets
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for name in SUPABASE_URL SUPABASE_PUBLISHABLE_KEY ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              printf '%s\n' "$name" >&2
              missing=1
            fi
          done
          exit "$missing"

      - name: Install Android SDK 36 tools
        shell: bash
        run: |
          set -uo pipefail
          set +e
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;36.0.0"
          sdkmanager_status=${PIPESTATUS[1]}
          set -e
          if [ "$sdkmanager_status" -ne 0 ]; then
            exit "$sdkmanager_status"
          fi

      - name: Decode release keystore
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          keystore_path="$RUNNER_TEMP/luc-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          chmod 600 "$keystore_path"
          printf 'ANDROID_KEYSTORE_PATH=%s\n' "$keystore_path" >> "$GITHUB_ENV"

      - name: Build and verify signed release APK
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ./gradlew --no-daemon testDebugUnitTest lintRelease assembleRelease
          apk_path=app/build/outputs/apk/release/app-release.apk
          ./scripts/verify-apk-contract.sh "$apk_path"
          cp "$apk_path" Luc-0.1.5-release.apk
          build_tools="$ANDROID_HOME/build-tools/36.0.0"
          "$build_tools/apksigner" verify --verbose Luc-0.1.5-release.apk
          keytool -printcert -jarfile Luc-0.1.5-release.apk

      - name: Verify pull request
        if: github.event_name == 'pull_request'
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug

      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: Luc-0.1.5-release.apk
          path: Luc-0.1.5-release.apk
          if-no-files-found: error
          retention-days: 30
