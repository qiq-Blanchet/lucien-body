<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="css/bubble.css">
</head>
<body>
  <div id="bubble" class="bubble" role="status" aria-live="polite"></div>
  <script>
    window.LucBubble = {
      setPlacement(belowPet) {
        document.body.classList.toggle("bubble-below", Boolean(belowPet));
      },
      show(text, style, revision) {
        const allowed = new Set(["normal", "whisper", "shout", "love", "sleepy"]);
        const bubble = document.getElementById("bubble");
        const safeStyle = allowed.has(style) ? style : "normal";
        const normalizedText = String(text).slice(0, 120);
        const normalizedRevision = String(revision);
        if (
          bubble.classList.contains("bubble--visible") &&
          bubble.dataset.revision === normalizedRevision &&
          bubble.dataset.style === safeStyle &&
          bubble.textContent === normalizedText
        ) return;
        bubble.textContent = normalizedText;
        bubble.className = `bubble bubble--${safeStyle}`;
        bubble.dataset.revision = normalizedRevision;
        bubble.dataset.style = safeStyle;
        void bubble.offsetWidth;
        bubble.classList.add("bubble--visible");
      },
      hide() {
        const bubble = document.getElementById("bubble");
        bubble.className = "bubble";
        delete bubble.dataset.revision;
        delete bubble.dataset.style;
      }
    };
  </script>
</body>
</html>
