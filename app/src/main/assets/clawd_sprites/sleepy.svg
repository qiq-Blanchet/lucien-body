<svg height="500" viewbox="-15 -25 45 45" width="500" xmlns="http://www.w3.org/2000/svg">
<style>
svg{shape-rendering:crispEdges}
.shadow{opacity:.28}
.body{transform-origin:7.5px 10px}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-1px)}}
@keyframes droop{0%,100%{transform:translateY(0)}50%{transform:translateY(1px)}}
@keyframes shake{0%,100%{transform:translateX(-0.8px)}50%{transform:translateX(0.8px)}}
@keyframes stomp{0%,100%{transform:translateY(0)}50%{transform:translateY(1px)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-1px)}}
@keyframes twinkle{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes rise{0%{transform:translateY(0);opacity:.3}50%{opacity:1}100%{transform:translateY(-4px);opacity:0}}
@keyframes drift{0%,100%{transform:translateY(0)}50%{transform:translateY(-0.7px)}}
@keyframes snapL{0%,100%{transform:rotate(-18deg)}50%{transform:rotate(-45deg)}}
@keyframes snapR{0%,100%{transform:rotate(18deg)}50%{transform:rotate(45deg)}}
@keyframes nod{0%,100%{transform:translateY(0)}50%{transform:translateY(0.4px)}}
</style>
<rect class="shadow" fill="#000" height="1" width="9" x="3" y="15"></rect>
<g><rect fill="#7AA5FF" height="1" style="animation:rise 1.6s infinite" width="2" x="15" y="2"></rect><rect fill="#7AA5FF" height="1" style="animation:rise 1.6s infinite" width="1" x="16" y="3"></rect></g>
<g class="body" style="animation:droop 2.4s infinite ease-in-out;">
<g fill="#DE886D">
<rect height="2" width="1" x="3" y="13"></rect>
<rect height="2" width="1" x="5" y="13"></rect>
<rect height="2" width="1" x="9" y="13"></rect>
<rect height="2" width="1" x="11" y="13"></rect>
<rect height="7" width="11" x="2" y="6"></rect>
<rect fill="#DE886D" height="1.6" width="2" x="1" y="11"></rect><rect fill="#DE886D" height="1.6" width="2" x="12" y="11"></rect>
</g>
<rect fill="#BFDFFF" height="3" rx="1" width="11" x="2" y="12"></rect><rect fill="#DFF1FF" height="1" width="9" x="3" y="13"></rect>
<g><rect fill="#000" height="1" width="2" x="4" y="9"></rect><rect fill="#000" height="1" width="2" x="10" y="9"></rect></g>
</g>
</svg>