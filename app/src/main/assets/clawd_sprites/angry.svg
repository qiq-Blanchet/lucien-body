<svg height="500" viewbox="-15 -25 45 45" width="500" xmlns="http://www.w3.org/2000/svg"><style>
svg{shape-rendering:crispEdges}
.eyeTrack,.bolt,.steam,.dust,.drop,.feetA,.feetB,.clawL,.clawR,.crabMove,.hovery,.swayy{transform-box:fill-box;transform-origin:center}
.shadow{opacity:.28}
@keyframes footHopA{0%,100%{transform:translateY(0)}50%{transform:translateY(-0.4px)}}
@keyframes footHopB{0%,100%{transform:translateY(-0.2px)}50%{transform:translateY(0.2px)}}
@keyframes clawPoundL{0%,100%{transform:translateY(0)}50%{transform:translateY(0.8px)}}
@keyframes clawPoundR{0%,100%{transform:translateY(0.8px)}50%{transform:translateY(0)}}
@keyframes flashBolt{0%,45%,100%{opacity:.18}52%,72%{opacity:1}}
</style>
<g opacity="0.95"><rect fill="#60646E" height="2" width="5" x="13" y="1"></rect><rect fill="#60646E" height="1" width="3" x="14" y="0"></rect><g class="bolt" style="animation:flashBolt .85s infinite ease-in-out"><rect fill="#FFD54A" height="1" width="1" x="15" y="3"></rect><rect fill="#FFD54A" height="1" width="1" x="16" y="4"></rect></g></g>
<rect class="shadow" fill="#000" height="1" width="9" x="3" y="15"></rect>
<g fill="#D8826B"><rect height="7" width="11" x="2" y="6"></rect></g>
<g class="feetA" style="animation:footHopA .55s infinite ease-in-out"><rect fill="#D8826B" height="3" width="1" x="3" y="12"></rect><rect fill="#D8826B" height="3" width="1" x="9" y="12"></rect></g>
<g class="feetB" style="animation:footHopB .55s infinite ease-in-out"><rect fill="#D8826B" height="3" width="1" x="5" y="12"></rect><rect fill="#D8826B" height="3" width="1" x="11" y="12"></rect></g>
<g class="clawL" style="animation:clawPoundL .55s infinite ease-in-out"><rect fill="#DE886D" height="2" width="2" x="1" y="8.5"></rect></g>
<g class="clawR" style="animation:clawPoundR .55s infinite ease-in-out"><rect fill="#DE886D" height="2" width="2" x="12" y="8.5"></rect></g>
<g class="eyeTrack"><rect fill="#000" height="2" width="1" x="4" y="8"></rect><rect fill="#000" height="2" width="1" x="9" y="8"></rect></g>
</svg>